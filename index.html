<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Survival Game - Jump & Animation Fix</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; user-select: none; }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; background: rgba(255,255,255,0.8);
            border-radius: 50%; transform: translate(-50%, -50%);
            border: 1px solid black; pointer-events: none; z-index: 10;
        }

        #ui { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); z-index: 10; }
        #ui h2 { margin: 0 0 5px 0; font-size: 22px; }
        #ui p { margin: 0; font-size: 13px; opacity: 0.9; }

        #hotbar {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); display: flex; gap: 10px;
            background: rgba(0,0,0,0.6); padding: 10px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2); z-index: 10;
        }
        .hotbar-slot {
            width: 55px; height: 55px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #555; border-radius: 8px;
        }

        #inventory-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); display: none;
            justify-content: center; align-items: center; z-index: 30;
        }
        #inventory-box {
            width: 650px; height: 400px;
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #555; border-radius: 12px;
            display: flex; padding: 20px; gap: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #slots-container {
            display: grid; grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(3, 1fr); gap: 10px; flex: 2;
        }
        .inv-slot {
            background: rgba(255,255,255,0.05);
            border: 2px solid #444; border-radius: 8px;
        }
        #crafting-space {
            flex: 1; background: rgba(255,255,255,0.02);
            border: 2px dashed #444; border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            color: #888; font-size: 16px;
        }

        #instructions {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            color: white; background: rgba(0,0,0,0.85); display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; z-index: 20; text-align: center;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    
    <div id="ui">
        <h2>3D Survival Engine</h2>
        <p>WASD: Move | SPACE: Jump | F3: Perspective | I: Inventory</p>
    </div>

    <div id="hotbar">
        <div class="hotbar-slot"></div>
        <div class="hotbar-slot"></div>
        <div class="hotbar-slot"></div>
        <div class="hotbar-slot"></div>
        <div class="hotbar-slot"></div>
    </div>

    <div id="inventory-overlay">
        <div id="inventory-box">
            <div id="slots-container"></div>
            <div id="crafting-space">Crafting Space</div>
        </div>
    </div>

    <div id="instructions">
        <h1>CLICK TO PLAY</h1>
        <p>WASD = Move | SPACE = Jump | F3 = Camera View | I = Inventory</p>
    </div>

    <script>
        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.008);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- LIGHTS ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(40, 80, 40);
        sun.castShadow = true;
        scene.add(sun);

        // --- TERRAIN ---
        function getTerrainHeight(x, z) {
            return Math.sin(x * 0.03) * Math.cos(z * 0.03) * 3;
        }

        const mapSize = 200;
        const floorGeo = new THREE.PlaneGeometry(mapSize, mapSize, 60, 60);
        const positions = floorGeo.attributes.position.array;
        for (let i = 0; i < positions.length; i += 3) {
            positions[i+2] = getTerrainHeight(positions[i], positions[i+1]);
        }
        floorGeo.computeVertexNormals();

        const floorMat = new THREE.MeshLambertMaterial({ color: 0x3b7a57 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- COLLISION SYSTEM SETUP ---
        const colliders = [];

        function createTree(x, z) {
            const tree = new THREE.Group();
            const y = getTerrainHeight(x, z);

            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.5, 3, 6),
                new THREE.MeshLambertMaterial({ color: 0x5c4033 })
            );
            trunk.position.y = 1.5;
            trunk.castShadow = true;
            tree.add(trunk);

            const leaves = new THREE.Mesh(
                new THREE.ConeGeometry(1.6, 3.5, 6),
                new THREE.MeshLambertMaterial({ color: 0x1e5631 })
            );
            leaves.position.y = 4;
            leaves.castShadow = true;
            tree.add(leaves);

            tree.position.set(x, y, z);
            scene.add(tree);

            colliders.push({ x: x, z: z, radius: 0.8 });
        }

        function createRock(x, z) {
            const y = getTerrainHeight(x, z);
            const rSize = 1.2 + Math.random() * 0.8;
            const rockGeo = new THREE.DodecahedronGeometry(rSize, 1);
            const rockMat = new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.8 });
            const rock = new THREE.Mesh(rockGeo, rockMat);
            
            rock.position.set(x, y + 0.4, z);
            rock.rotation.set(Math.random(), Math.random(), Math.random());
            rock.castShadow = true;
            rock.receiveShadow = true;
            scene.add(rock);

            colliders.push({ x: x, z: z, radius: rSize * 0.9 });
        }

        for(let i=0; i<45; i++) {
            let x = (Math.random() - 0.5) * 160;
            let z = (Math.random() - 0.5) * 160;
            if(Math.hypot(x, z) > 10) createTree(x, z);
        }
        for(let i=0; i<35; i++) {
            let x = (Math.random() - 0.5) * 160;
            let z = (Math.random() - 0.5) * 160;
            if(Math.hypot(x, z) > 10) createRock(x, z);
        }

        // --- PLAYER SETUP ---
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        let playerMesh = null;
        let mixer = null;
        let animationsMap = new Map();
        const playerRadius = 0.5;

        // Height offset fix (Elevates player so feet rest above the ground)
        const PLAYER_HEIGHT_OFFSET = 1.0;

        const loader = new THREE.GLTFLoader();
        loader.load('player.glb', (gltf) => {
            playerMesh = gltf.scene;
            playerMesh.scale.set(1, 1, 1);
            playerMesh.rotation.y = Math.PI;
            playerMesh.castShadow = true;
            
            playerMesh.position.y = PLAYER_HEIGHT_OFFSET;
            playerGroup.add(playerMesh);

            if(gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(playerMesh);
                gltf.animations.forEach(clip => {
                    animationsMap.set(clip.name.toLowerCase(), mixer.clipAction(clip));
                });
                const firstAnim = animationsMap.values().next().value;
                if(firstAnim) firstAnim.play();
            }

            updatePerspective();
        }, undefined, () => {
            // Fallback mesh
            playerMesh = new THREE.Mesh(
                new THREE.CapsuleGeometry(playerRadius, 1, 4, 8),
                new THREE.MeshStandardMaterial({ color: 0x2266cc })
            );
            playerMesh.position.y = PLAYER_HEIGHT_OFFSET + 0.5;
            playerGroup.add(playerMesh);
            updatePerspective();
        });

        // --- CAMERA PERSPECTIVE ---
        let isThirdPerson = false;
        const cameraRig = new THREE.Group();
        playerGroup.add(cameraRig);
        cameraRig.add(camera);

        function updatePerspective() {
            if (!isThirdPerson) {
                camera.position.set(0, PLAYER_HEIGHT_OFFSET + 1.6, 0.1);
                camera.rotation.set(0, 0, 0);
                if (playerMesh) playerMesh.visible = false;
            } else {
                camera.position.set(0, PLAYER_HEIGHT_OFFSET + 2.0, 3.8);
                camera.rotation.set(-0.2, 0, 0);
                if (playerMesh) playerMesh.visible = true;
            }
        }
        updatePerspective();

        // --- INVENTORY & POINTER LOCK ---
        let isLocked = false;
        let isInventoryOpen = false;
        const instructions = document.getElementById('instructions');
        const inventoryOverlay = document.getElementById('inventory-overlay');

        instructions.addEventListener('click', () => {
            if(!isInventoryOpen) document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            isLocked = (document.pointerLockElement === document.body);
            if (!isLocked && !isInventoryOpen) {
                instructions.style.display = 'flex';
            } else {
                instructions.style.display = 'none';
            }
        });

        let yaw = 0, pitch = 0;
        document.addEventListener('mousemove', (e) => {
            if (!isLocked || isInventoryOpen) return;

            yaw -= e.movementX * 0.0025;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-1.2, Math.min(1.2, pitch));

            playerGroup.rotation.y = yaw;
            cameraRig.rotation.x = pitch;
        });

        // Inventory UI
        const slotsContainer = document.getElementById('slots-container');
        for(let i=0; i<15; i++) {
            const slot = document.createElement('div');
            slot.className = 'inv-slot';
            slotsContainer.appendChild(slot);
        }

        // --- KEYBOARD & JUMPING LOGIC ---
        const keys = {};
        let velocityY = 0;
        let isGrounded = true;
        const GRAVITY = -25;
        const JUMP_FORCE = 9;

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;

            if (e.code === 'F3') {
                e.preventDefault();
                isThirdPerson = !isThirdPerson;
                updatePerspective();
            }

            if (e.code === 'KeyI') {
                isInventoryOpen = !isInventoryOpen;
                if (isInventoryOpen) {
                    inventoryOverlay.style.display = 'flex';
                    instructions.style.display = 'none';
                    document.exitPointerLock();
                } else {
                    inventoryOverlay.style.display = 'none';
                    document.body.requestPointerLock();
                }
            }

            if (e.code === 'Space' && isGrounded && isLocked && !isInventoryOpen) {
                velocityY = JUMP_FORCE;
                isGrounded = false;
            }

            if (e.code === 'Escape' && isInventoryOpen) {
                isInventoryOpen = false;
                inventoryOverlay.style.display = 'none';
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // --- COLLISION CHECKER ---
        function checkCollisions(targetPos) {
            for (let obs of colliders) {
                const dist = Math.hypot(targetPos.x - obs.x, targetPos.z - obs.z);
                const minDist = playerRadius + obs.radius;
                if (dist < minDist) {
                    return true;
                }
            }
            return false;
        }

        // --- GAME LOOP ---
        let clock = new THREE.Clock();
        let walkTimer = 0;

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            if (isLocked && !isInventoryOpen) {
                const moveSpeed = 8 * delta;
                const moveVector = new THREE.Vector3();

                if (keys['KeyW']) moveVector.z -= 1;
                if (keys['KeyS']) moveVector.z += 1;
                if (keys['KeyA']) moveVector.x -= 1;
                if (keys['KeyD']) moveVector.x += 1;

                let isMoving = moveVector.lengthSq() > 0;

                if (isMoving) {
                    moveVector.normalize();
                    moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                    
                    const nextPos = playerGroup.position.clone().addScaledVector(moveVector, moveSpeed);

                    if (!checkCollisions(nextPos)) {
                        playerGroup.position.copy(nextPos);
                    }

                    // Procedural walk animation (sway/bobbing) if model lacks built-in rig animations
                    if (playerMesh && (!mixer || animationsMap.size === 0)) {
                        walkTimer += delta * 12;
                        playerMesh.rotation.z = Math.sin(walkTimer) * 0.05;
                        playerMesh.rotation.x = Math.cos(walkTimer * 2) * 0.03;
                    }
                } else if (playerMesh && (!mixer || animationsMap.size === 0)) {
                    // Reset rotation when stopping
                    playerMesh.rotation.z = THREE.MathUtils.lerp(playerMesh.rotation.z, 0, 0.1);
                    playerMesh.rotation.x = THREE.MathUtils.lerp(playerMesh.rotation.x, 0, 0.1);
                }

                // Gravity & Jump Physics
                const terrainHeight = getTerrainHeight(playerGroup.position.x, playerGroup.position.z);
                
                velocityY += GRAVITY * delta;
                playerGroup.position.y += velocityY * delta;

                if (playerGroup.position.y <= terrainHeight) {
                    playerGroup.position.y = terrainHeight;
                    velocityY = 0;
                    isGrounded = true;
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
