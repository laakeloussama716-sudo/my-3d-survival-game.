<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Survival Game - First/Third Person</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        
        /* Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px; background: rgba(255,255,255,0.8);
            border-radius: 50%; transform: translate(-50%, -50%);
            border: 1px solid black; pointer-events: none; z-index: 10;
        }

        /* Top UI */
        #ui { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); z-index: 10; }
        #ui h2 { margin: 0 0 5px 0; font-size: 24px; }
        #ui p { margin: 0; font-size: 14px; opacity: 0.9; }

        /* Hotbar (5 Slots) */
        #hotbar {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); display: flex; gap: 10px;
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2); z-index: 10;
        }
        .hotbar-slot {
            width: 60px; height: 60px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #666; border-radius: 8px;
        }

        /* Inventory (Press I) */
        #inventory-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); display: none;
            justify-content: center; align-items: center; z-index: 30;
        }
        #inventory-box {
            width: 700px; height: 450px;
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #444; border-radius: 15px;
            display: flex; padding: 20px; gap: 20px;
        }
        #slots-container {
            display: grid; grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(3, 1fr); gap: 10px; flex: 2;
        }
        .inv-slot {
            background: rgba(255,255,255,0.05);
            border: 2px solid #555; border-radius: 8px;
        }
        #crafting-space {
            flex: 1; background: rgba(255,255,255,0.03);
            border: 2px dashed #444; border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            color: #666; font-size: 18px;
        }

        /* Instructions Overlay */
        #instructions {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            color: white; background: rgba(0,0,0,0.85); display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; z-index: 20; text-align: center;
        }
        #instructions h1 { font-size: 48px; margin-bottom: 10px; }
        #instructions p { font-size: 18px; line-height: 1.6; opacity: 0.8; }
    </style>

    <!-- Include Three.js and GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    
    <div id="ui">
        <h2>3D Survival Engine</h2>
        <p>WASD: Move | Mouse: Look | F3: Toggle Perspective | I: Inventory</p>
    </div>

    <!-- Hotbar -->
    <div id="hotbar">
        <div class="hotbar-slot"></div>
        <div class="hotbar-slot"></div>
        <div class="hotbar-slot"></div>
        <div class="hotbar-slot"></div>
        <div class="hotbar-slot"></div>
    </div>

    <!-- Inventory Overlay -->
    <div id="inventory-overlay">
        <div id="inventory-box">
            <div id="slots-container">
                <!-- 15 Slots generated by JS -->
            </div>
            <div id="crafting-space">Crafting</div>
        </div>
    </div>

    <!-- Instructions -->
    <div id="instructions">
        <h1>CLICK TO PLAY</h1>
        <p>
            You will start in **First Person** view.<br>
            Press **F3** to switch to **Third Person** (see your back).<br>
            Press **I** to open the Inventory.
        </p>
    </div>

    <script>
        // --- SCENE & CAMERA SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky color
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.005); // Add atmosphere

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Enable shadows
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const sun = new THREE.DirectionalLight(0xffffff, 1.0);
        sun.position.set(50, 100, 50);
        sun.castShadow = true;
        sun.shadow.camera.left = -100;
        sun.shadow.camera.right = 100;
        sun.shadow.camera.top = 100;
        sun.shadow.camera.bottom = -100;
        scene.add(sun);

        // --- TERRAIN (Hills, Plains) ---
        function getTerrainHeight(x, z) {
            // Simple noise-like function for mountains/valleys
            return Math.sin(x * 0.02) * Math.cos(z * 0.02) * 5 + Math.sin(x * 0.1) * 1;
        }

        const mapSize = 250;
        const segments = 100;
        const floorGeo = new THREE.PlaneGeometry(mapSize, mapSize, segments, segments);
        
        // Apply height to vertices
        const positions = floorGeo.attributes.position.array;
        for (let i = 0; i < positions.length; i += 3) {
            const x = positions[i];
            const z = positions[i+1];
            positions[i+2] = getTerrainHeight(x, z);
        }
        floorGeo.computeVertexNormals(); // For proper lighting

        const floorMat = new THREE.MeshLambertMaterial({ color: 0x3b7a57 }); // Green grass
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- ENVIRONMENT OBJECTS (Trees, Rocks) ---
        const trees = [];
        const rocks = [];

        function createTree(x, z) {
            const treeGroup = new THREE.Group();
            const y = getTerrainHeight(x, z);

            // Trunk
            const trunkGeo = new THREE.CylinderGeometry(0.3, 0.5, 4, 8);
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5c4033 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 2;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            // Leaves
            const leafMat = new THREE.MeshLambertMaterial({ color: 0x1e5631 });
            const leafLevel1 = new THREE.Mesh(new THREE.ConeGeometry(2, 4, 8), leafMat);
            leafLevel1.position.y = 5;
            leafLevel1.castShadow = true;
            treeGroup.add(leafLevel1);
            
            const leafLevel2 = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 8), leafMat);
            leafLevel2.position.y = 6.5;
            leafLevel2.castShadow = true;
            treeGroup.add(leafLevel2);

            treeGroup.position.set(x, y, z);
            scene.add(treeGroup);
            trees.push(treeGroup);
        }

        function createRock(x, z) {
            const rockGroup = new THREE.Group();
            const y = getTerrainHeight(x, z);
            
            const rockMat = new THREE.MeshLambertMaterial({ color: 0x777777 });
            const rockGeo = new THREE.DodecahedronGeometry(Math.random() * 1 + 0.5, 0);
            const rock = new THREE.Mesh(rockGeo, rockMat);
            rock.castShadow = true;
            rock.scale.set(1, Math.random() * 0.5 + 0.5, 1);
            rock.position.y = rock.scale.y * 0.5;

            rockGroup.position.set(x, y, z);
            rockGroup.rotation.y = Math.random() * Math.PI;
            scene.add(rockGroup);
            rocks.push(rockGroup);
        }

        // Scatter objects (avoid spawning too close to origin)
        for(let i=0; i<300; i++) {
            const x = (Math.random() - 0.5) * (mapSize - 20);
            const z = (Math.random() - 0.5) * (mapSize - 20);
            if(Math.sqrt(x*x + z*z) > 10) createTree(x, z);
        }
        for(let i=0; i<150; i++) {
            const x = (Math.random() - 0.5) * (mapSize - 20);
            const z = (Math.random() - 0.5) * (mapSize - 20);
            if(Math.sqrt(x*x + z*z) > 10) createRock(x, z);
        }

        // --- PLAYER GROUP (Container for model & camera) ---
        const playerGroup = new THREE.Group();
        // Start player at a safe height, and update to terrain y later
        playerGroup.position.set(0, 5, 0); 
        scene.add(playerGroup);

        // --- MODEL LOADING ---
        let playerMesh = null;
        const loader = new THREE.GLTFLoader();
        
        loader.load('player.glb', (gltf) => {
            playerMesh = gltf.scene;
            playerMesh.scale.set(1.1, 1.1, 1.1); // Slightly larger
            
            // Fix model rotation: Rotate 180 degrees so camera sees back in 3rd person
            playerMesh.rotation.y = Math.PI; 
            
            // Fix model vertical position: ensure feet are at container's y=0
            const box = new THREE.Box3().setFromObject(playerMesh);
            const height = box.max.y - box.min.y;
            playerMesh.position.y = -box.min.y; // Raise mesh so min.y is at 0

            playerMesh.castShadow = true;
            playerMesh.receiveShadow = true;
            playerGroup.add(playerMesh);
            
            console.log("Player GLB Loaded & Fixed");
            
            // Ensure first person setup is correct after loading
            updateCameraPerspective(); 
        }, undefined, (err) => {
            console.error("Error loading player.glb:", err);
            // Fallback: simple box
            const fallbackGeo = new THREE.BoxGeometry(0.8, 1.8, 0.5);
            const fallbackMat = new THREE.MeshLambertMaterial({color: 0xff0000});
            playerMesh = new THREE.Mesh(fallbackGeo, fallbackMat);
            playerMesh.position.y = 0.9;
            playerMesh.rotation.y = Math.PI;
            playerGroup.add(playerMesh);
            updateCameraPerspective();
        });

        // --- CAMERA PERSPECTIVE LOGIC ---
        // 0: First Person, 1: Third Person
        let currentPerspective = 0; 
        const fpCameraPos = new THREE.Vector3(0, 1.6, 0); // At head height
        const tpCameraPos = new THREE.Vector3(0, 2.5, 4.5); // Behind & Above

        function updateCameraPerspective() {
            if (currentPerspective === 0) {
                // First Person: Camera inside head, model hidden
                camera.position.copy(fpCameraPos);
                camera.lookAt(0, 1.6, -1); // Look forward
                if (playerMesh) playerMesh.visible = false;
                console.log("Switched to First Person");
            } else {
                // Third Person: Camera behind head, model visible
                camera.position.copy(tpCameraPos);
                camera.lookAt(0, 1.2, 0); // Look at back/waist
                if (playerMesh) playerMesh.visible = true;
                console.log("Switched to Third Person");
            }
            playerGroup.add(camera); // Re-attach camera to guarantee relative positioning
        }

        // Set initial state
        updateCameraPerspective();

        // --- CONTROLS ---
        let isLocked = false;
        let yaw = 0, pitch = 0;
        const instructions = document.getElementById('instructions');
        const inventoryOverlay = document.getElementById('inventory-overlay');
        let isInventoryOpen = false;

        instructions.addEventListener('click', () => { document.body.requestPointerLock(); });

        document.addEventListener('pointerlockchange', () => {
            isLocked = (document.pointerLockElement === document.body);
            instructions.style.display = isLocked ? 'none' : 'flex';
            if(!isLocked && isInventoryOpen) closeInventory();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isLocked || isInventoryOpen) return;
            yaw -= e.movementX * 0.003;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, pitch)); // Clamp looking up/down

            playerGroup.rotation.y = yaw;
            
            // Pitch only affects camera, not model rotation
            if(currentPerspective === 0) {
                camera.rotation.x = pitch;
            } else {
                // Third person camera rotation logic (keep looking at player)
                const offset = new THREE.Vector3().copy(tpCameraPos);
                offset.applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
                camera.position.copy(offset);
                camera.lookAt(0, 1.2, 0);
            }
        });

        // Key states
        const keys = { w: false, s: false, a: false, d: false };
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = true;
            
            // F3: Toggle Perspective
            if (e.key === 'F3') {
                e.preventDefault(); // Prevent browser default F3 action
                if(isLocked && !isInventoryOpen) {
                    currentPerspective = (currentPerspective + 1) % 2;
                    updateCameraPerspective();
                }
            }

            // I: Inventory
            if (key === 'i') {
                if(isLocked) {
                    if(isInventoryOpen) closeInventory(); else openInventory();
                }
            }
            
            // ESC to close inventory if open
            if(e.key === 'Escape' && isInventoryOpen) {
                closeInventory();
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = false;
        });

        // --- INVENTORY LOGIC ---
        const slotsContainer = document.getElementById('slots-container');
        // Generate 15 slots
        for(let i=0; i<15; i++) {
            const slot = document.createElement('div');
            slot.className = 'inv-slot';
            slotsContainer.appendChild(slot);
        }

        function openInventory() {
            isInventoryOpen = true;
            inventoryOverlay.style.display = 'flex';
            document.exitPointerLock(); // Release mouse control
        }

        function closeInventory() {
            isInventoryOpen = false;
            inventoryOverlay.style.display = 'none';
            document.body.requestPointerLock(); // Re-lock mouse
        }

        // --- GAME LOOP ---
        let prevTime = performance.now();
        const playerVelocity = new THREE.Vector3();
        const playerSpeed = 10;

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            prevTime = time;

            if (isLocked && !isInventoryOpen) {
                // Movement
                playerVelocity.set(0, 0, 0);
                if (keys.w) playerVelocity.z -= 1;
                if (keys.s) playerVelocity.z += 1;
                if (keys.a) playerVelocity.x -= 1;
                if (keys.d) playerVelocity.x += 1;

                playerVelocity.normalize();
                playerVelocity.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                
                playerGroup.position.addScaledVector(playerVelocity, playerSpeed * delta);
                
                // Snap to terrain height + fix model height offset
                const currentH = getTerrainHeight(playerGroup.position.x, playerGroup.position.z);
                playerGroup.position.y = currentH; 
            }

            renderer.render(scene, camera);
        }

        animate();

        // --- RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
