<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Survival Game - Independent Mining System</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; user-select: none; }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; background: rgba(255,255,255,0.8);
            border-radius: 50%; transform: translate(-50%, -50%);
            border: 1px solid black; pointer-events: none; z-index: 10;
        }

        #ui { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); z-index: 10; }
        #ui h2 { margin: 0 0 5px 0; font-size: 22px; }
        #ui p { margin: 0; font-size: 13px; opacity: 0.9; }

        #fps-counter {
            position: absolute; top: 10px; right: 10px; color: #00ffcc;
            font-family: monospace; font-size: 16px; font-weight: bold;
            background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px;
            display: none; z-index: 10; border: 1px solid rgba(0,255,204,0.3);
        }

        #hotbar {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); display: flex; gap: 10px;
            background: rgba(0,0,0,0.6); padding: 10px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2); z-index: 10;
        }
        .hotbar-slot {
            width: 55px; height: 55px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #555; border-radius: 8px;
        }

        #inventory-overlay, #settings-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); display: none;
            justify-content: center; align-items: center; z-index: 30;
        }
        
        .modal-box {
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #555; border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8); color: white;
        }

        #inventory-box { width: 650px; height: 400px; display: flex; padding: 20px; gap: 20px; }
        #slots-container { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px; flex: 2; }
        .inv-slot { background: rgba(255,255,255,0.05); border: 2px solid #444; border-radius: 8px; }
        #crafting-space { flex: 1; background: rgba(255,255,255,0.02); border: 2px dashed #444; border-radius: 10px; display: flex; justify-content: center; align-items: center; color: #888; font-size: 16px; }

        #settings-box { width: 380px; padding: 25px; display: flex; flex-direction: column; gap: 20px; }
        #settings-box h2 { margin: 0 0 10px 0; text-align: center; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .setting-row { display: flex; flex-direction: column; gap: 8px; }
        .setting-row label { font-size: 14px; display: flex; justify-content: space-between; }
        .setting-row input[type="range"] { width: 100%; cursor: pointer; }
        .setting-checkbox { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }

        #instructions {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            color: white; background: rgba(0,0,0,0.85); display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; z-index: 20; text-align: center;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="fps-counter">FPS: 0</div>
    
    <div id="ui">
        <h2>3D Survival Engine</h2>
        <p>WASD: Move | SPACE: Jump | Left Click: Mine | F3: Camera | I: Inventory | P: Settings</p>
    </div>

    <div id="hotbar">
        <div class="hotbar-slot"></div>
        <div class="hotbar-slot"></div>
        <div class="hotbar-slot"></div>
        <div class="hotbar-slot"></div>
        <div class="hotbar-slot"></div>
    </div>

    <div id="inventory-overlay">
        <div id="inventory-box" class="modal-box">
            <div id="slots-container"></div>
            <div id="crafting-space">Crafting Space</div>
        </div>
    </div>

    <div id="settings-overlay">
        <div id="settings-box" class="modal-box">
            <h2>Settings</h2>
            
            <div class="setting-row">
                <label>Graphics Quality: <span id="gfx-value">100%</span></label>
                <input type="range" id="gfx-slider" min="0" max="100" value="100">
            </div>

            <div class="setting-row">
                <label>Audio Volume: <span id="vol-value">80%</span></label>
                <input type="range" id="vol-slider" min="0" max="100" value="80">
            </div>

            <div class="setting-checkbox">
                <span>Show FPS Counter</span>
                <input type="checkbox" id="fps-toggle">
            </div>
        </div>
    </div>

    <div id="instructions">
        <h1 id="loading-title">LOADING MAP...</h1>
        <p id="loading-sub">Please wait until terrain assets load completely</p>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.003);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const sun = new THREE.DirectionalLight(0xffffff, 1.0);
        sun.position.set(50, 150, 50);
        sun.castShadow = true;
        scene.add(sun);

        const loader = new THREE.GLTFLoader();
        let mapSceneRoot = null;
        const allMapMeshes = [];
        let isMapLoaded = false;
        let objectIdCounter = 0;

        // --- ????? ??????? ???? ???????? ??????? ??? ??? ????? ---
        loader.load('tabletop_terrain.glb', (gltf) => {
            mapSceneRoot = gltf.scene;
            mapSceneRoot.position.set(0, 0, 0);

            mapSceneRoot.traverse((child) => {
                if (child.isMesh) {
                    child.receiveShadow = true;
                    child.castShadow = true;

                    // ??????? ??? ??????
                    const name = (child.name || '').toLowerCase();
                    const isGround = name.includes('terrain') || name.includes('ground') || name.includes('plane') || name.includes('landscape');

                    if (!isGround) {
                        // ????? ?? ???? ID ???? ????? ??? ????
                        objectIdCounter++;
                        child.name = "destructible_obj_" + objectIdCounter;

                        // ??? ?????? ?????? ??? ?? ????? ??? ??????? ????????
                        if (child.material) {
                            child.material = child.material.clone();
                        }

                        // ????? ?? ??? ??? ???? ???????
                        child.userData = {
                            id: child.name,
                            hp: 3,
                            isBreakable: true,
                            originalColor: child.material && child.material.color ? child.material.color.clone() : null
                        };
                    }

                    allMapMeshes.push(child);
                }
            });

            scene.add(mapSceneRoot);
            isMapLoaded = true;
            document.getElementById('loading-title').innerText = "CLICK TO PLAY";
            document.getElementById('loading-sub').innerText = "WASD = Move | SPACE = Jump | Left Click = Mine | F3 = Camera | I = Inventory | P = Settings";
        });

        const playerGroup = new THREE.Group();
        playerGroup.position.set(0, 30, 0);
        scene.add(playerGroup);

        let playerMesh = null;
        let mixer = null;
        let animationsMap = new Map();
        const playerRadius = 0.6;
        const PLAYER_HEIGHT_OFFSET = 1.0;

        loader.load('player.glb', (gltf) => {
            playerMesh = gltf.scene;
            playerMesh.scale.set(1, 1, 1);
            playerMesh.rotation.y = Math.PI;
            playerMesh.castShadow = true;
            playerMesh.position.y = PLAYER_HEIGHT_OFFSET;
            playerGroup.add(playerMesh);

            if(gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(playerMesh);
                gltf.animations.forEach(clip => {
                    animationsMap.set(clip.name.toLowerCase(), mixer.clipAction(clip));
                });
                const firstAnim = animationsMap.values().next().value;
                if(firstAnim) firstAnim.play();
            }

            updatePerspective();
        }, undefined, () => {
            playerMesh = new THREE.Mesh(
                new THREE.CapsuleGeometry(playerRadius, 1, 4, 8),
                new THREE.MeshStandardMaterial({ color: 0x2266cc })
            );
            playerMesh.position.y = PLAYER_HEIGHT_OFFSET + 0.5;
            playerGroup.add(playerMesh);
            updatePerspective();
        });

        let isThirdPerson = false;
        const cameraRig = new THREE.Group();
        playerGroup.add(cameraRig);
        cameraRig.add(camera);

        function updatePerspective() {
            if (!isThirdPerson) {
                camera.position.set(0, PLAYER_HEIGHT_OFFSET + 1.6, 0.1);
                camera.rotation.set(0, 0, 0);
                if (playerMesh) playerMesh.visible = false;
            } else {
                camera.position.set(0, PLAYER_HEIGHT_OFFSET + 2.0, 3.8);
                camera.rotation.set(-0.2, 0, 0);
                if (playerMesh) playerMesh.visible = true;
            }
        }
        updatePerspective();

        const downRaycaster = new THREE.Raycaster();
        const downVector = new THREE.Vector3(0, -1, 0);
        const mineRaycaster = new THREE.Raycaster();

        // --- ???? ??????? ??????? ??? ???? ?? ???? ??? ??? ---
        document.addEventListener('mousedown', (e) => {
            if (!isLocked || isInventoryOpen || isSettingsOpen || e.button !== 0 || !isMapLoaded) return;

            mineRaycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = mineRaycaster.intersectObjects(allMapMeshes, true);

            if (intersects.length > 0 && intersects[0].distance <= 12.0) {
                const hitObj = intersects[0].object;

                // ?????? ?? ??? ?????? ???? ??????? ????? ?????? ????
                if (hitObj.userData && hitObj.userData.isBreakable) {
                    
                    hitObj.userData.hp -= 1;

                    // ????? ????? (???? ???? ???? ????? ???????? ???)
                    if (hitObj.material && hitObj.material.color) {
                        hitObj.material.color.setHex(0xff0000);
                        setTimeout(() => {
                            if (hitObj.userData.originalColor) {
                                hitObj.material.color.copy(hitObj.userData.originalColor);
                            }
                        }, 120);
                    }

                    // ????? ?????? ??????? ??????? ???
                    if (hitObj.userData.hp <= 0) {
                        hitObj.visible = false;
                    }
                }
            }
        });

        let isLocked = false;
        let isInventoryOpen = false;
        let isSettingsOpen = false;

        const instructions = document.getElementById('instructions');
        const inventoryOverlay = document.getElementById('inventory-overlay');
        const settingsOverlay = document.getElementById('settings-overlay');

        instructions.addEventListener('click', () => {
            if(!isInventoryOpen && !isSettingsOpen && isMapLoaded) document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            isLocked = (document.pointerLockElement === document.body);
            instructions.style.display = (!isLocked && !isInventoryOpen && !isSettingsOpen) ? 'flex' : 'none';
        });

        let yaw = 0, pitch = 0;
        document.addEventListener('mousemove', (e) => {
            if (!isLocked || isInventoryOpen || isSettingsOpen) return;

            yaw -= e.movementX * 0.0025;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-1.2, Math.min(1.2, pitch));

            playerGroup.rotation.y = yaw;
            cameraRig.rotation.x = pitch;
        });

        const slotsContainer = document.getElementById('slots-container');
        for(let i=0; i<15; i++) {
            const slot = document.createElement('div');
            slot.className = 'inv-slot';
            slotsContainer.appendChild(slot);
        }

        const gfxSlider = document.getElementById('gfx-slider');
        const gfxValue = document.getElementById('gfx-value');
        const volSlider = document.getElementById('vol-slider');
        const volValue = document.getElementById('vol-value');
        const fpsToggle = document.getElementById('fps-toggle');
        const fpsCounter = document.getElementById('fps-counter');

        gfxSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            gfxValue.innerText = val + '%';
            const scale = Math.max(0.2, val / 100);
            renderer.setPixelRatio(window.devicePixelRatio * scale);
            if (val < 30) {
                renderer.shadowMap.enabled = false;
                scene.fog.density = 0.01;
            } else {
                renderer.shadowMap.enabled = true;
                scene.fog.density = 0.003;
            }
        });

        volSlider.addEventListener('input', (e) => {
            volValue.innerText = e.target.value + '%';
        });

        fpsToggle.addEventListener('change', (e) => {
            fpsCounter.style.display = e.target.checked ? 'block' : 'none';
        });

        const keys = {};
        let velocityY = 0;
        let isGrounded = false;
        const GRAVITY = -25;
        const JUMP_FORCE = 9.5;

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;

            if (e.code === 'F3') {
                e.preventDefault();
                isThirdPerson = !isThirdPerson;
                updatePerspective();
            }

            if (e.code === 'KeyI') {
                if (isSettingsOpen) closeSettings();
                isInventoryOpen = !isInventoryOpen;
                if (isInventoryOpen) {
                    inventoryOverlay.style.display = 'flex';
                    instructions.style.display = 'none';
                    document.exitPointerLock();
                } else {
                    inventoryOverlay.style.display = 'none';
                    document.body.requestPointerLock();
                }
            }

            if (e.code === 'KeyP') {
                if (isInventoryOpen) {
                    isInventoryOpen = false;
                    inventoryOverlay.style.display = 'none';
                }
                isSettingsOpen = !isSettingsOpen;
                if (isSettingsOpen) {
                    settingsOverlay.style.display = 'flex';
                    instructions.style.display = 'none';
                    document.exitPointerLock();
                } else {
                    closeSettings();
                }
            }

            if (e.code === 'Space' && isGrounded && isLocked && !isInventoryOpen && !isSettingsOpen) {
                velocityY = JUMP_FORCE;
                isGrounded = false;
            }

            if (e.code === 'Escape') {
                if (isInventoryOpen) {
                    isInventoryOpen = false;
                    inventoryOverlay.style.display = 'none';
                    document.body.requestPointerLock();
                }
                if (isSettingsOpen) closeSettings();
            }
        });

        function closeSettings() {
            isSettingsOpen = false;
            settingsOverlay.style.display = 'none';
            document.body.requestPointerLock();
        }

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        let clock = new THREE.Clock();
        let walkTimer = 0;
        let frameCount = 0;
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                fpsCounter.innerText = `FPS: ${frameCount}`;
                frameCount = 0;
                lastTime = currentTime;
            }

            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            if (isLocked && !isInventoryOpen && !isSettingsOpen && isMapLoaded) {
                const moveSpeed = 9 * delta;
                const moveVector = new THREE.Vector3();

                if (keys['KeyW']) moveVector.z -= 1;
                if (keys['KeyS']) moveVector.z += 1;
                if (keys['KeyA']) moveVector.x -= 1;
                if (keys['KeyD']) moveVector.x += 1;

                if (moveVector.lengthSq() > 0) {
                    moveVector.normalize();
                    moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                    playerGroup.position.addScaledVector(moveVector, moveSpeed);

                    if (playerMesh && (!mixer || animationsMap.size === 0)) {
                        walkTimer += delta * 12;
                        playerMesh.rotation.z = Math.sin(walkTimer) * 0.05;
                        playerMesh.rotation.x = Math.cos(walkTimer * 2) * 0.03;
                    }
                }

                downRaycaster.set(new THREE.Vector3(playerGroup.position.x, playerGroup.position.y + 1.2, playerGroup.position.z), downVector);
                const groundHits = downRaycaster.intersectObjects(allMapMeshes, true);

                let currentGroundY = null;
                for (let i = 0; i < groundHits.length; i++) {
                    const hit = groundHits[i];
                    if (!hit.object.visible) continue;

                    if (hit.point.y <= playerGroup.position.y + 1.3) {
                        currentGroundY = hit.point.y;
                        break;
                    }
                }

                if (currentGroundY !== null) {
                    velocityY += GRAVITY * delta;
                    playerGroup.position.y += velocityY * delta;

                    if (playerGroup.position.y <= currentGroundY + 0.05) {
                        playerGroup.position.y = currentGroundY + 0.05;
                        velocityY = 0;
                        isGrounded = true;
                    } else {
                        isGrounded = false;
                    }
                } else {
                    isGrounded = true;
                    velocityY = 0;
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
