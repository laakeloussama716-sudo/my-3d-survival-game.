<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Survival Game</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; }
        #crosshair {
            position: absolute; top: 40%; left: 50%;
            width: 8px; height: 8px; background: rgba(255,255,255,0.8);
            border-radius: 50%; transform: translate(-50%, -50%);
            border: 1px solid black; pointer-events: none; z-index: 10;
        }
        #ui { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 1px 1px 3px black; z-index: 10; }
        #instructions {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            color: white; background: rgba(0,0,0,0.75); display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; z-index: 20;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="ui">
        <h2>3D Survival Engine</h2>
        <p>Controls: WASD = Move | Mouse = Look Around</p>
    </div>

    <div id="instructions">
        <h1>CLICK TO PLAY</h1>
        <p>(Third Person Camera Active)</p>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(50, 100, 50);
        scene.add(sun);

        // Ground
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x3b7a57 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Player Container & Camera Setup
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        camera.position.set(0, 2.5, 4.5);
        camera.lookAt(0, 1.2, 0);
        playerGroup.add(camera);

        // Load Real GLB Model
        const loader = new THREE.GLTFLoader();
        loader.load('player.glb', (gltf) => {
            const playerMesh = gltf.scene;
            playerMesh.scale.set(1, 1, 1);
            playerMesh.position.y = 0;
            playerGroup.add(playerMesh);
            console.log("Real GLB Player Loaded!");
        }, undefined, (err) => {
            console.error("Error loading model:", err);
        });

        // Controls
        let isLocked = false;
        let yaw = 0, pitch = 0;
        const instructions = document.getElementById('instructions');

        instructions.addEventListener('click', () => { document.body.requestPointerLock(); });

        document.addEventListener('pointerlockchange', () => {
            isLocked = (document.pointerLockElement === document.body);
            instructions.style.display = isLocked ? 'none' : 'flex';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isLocked) return;
            yaw -= e.movementX * 0.003;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-0.4, Math.min(0.6, pitch));

            playerGroup.rotation.y = yaw;
            camera.position.y = 2.5 + pitch * 2;
            camera.position.z = 4.5 - pitch;
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.2, playerGroup.position.z);
        });

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyD') moveRight = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyD') moveRight = false;
        });

        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            prevTime = time;

            if (isLocked) {
                const moveSpeed = 8 * delta;
                const moveVector = new THREE.Vector3();

                if (moveForward) moveVector.z -= 1;
                if (moveBackward) moveVector.z += 1;
                if (moveLeft) moveVector.x -= 1;
                if (moveRight) moveVector.x += 1;

                moveVector.normalize();
                moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                playerGroup.position.addScaledVector(moveVector, moveSpeed);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
