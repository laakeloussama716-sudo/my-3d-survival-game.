<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>My 3D Game</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #instructions {
            position: absolute; top: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; background: rgba(0,0,0,0.7); color: white;
            cursor: pointer; z-index: 10; user-select: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px; margin-top: -5px; margin-left: -5px;
            background-color: white; border-radius: 50%;
            pointer-events: none; z-index: 5; border: 1px solid black;
        }
    </style>
    <!-- ????? Three.js ?????? GLTFLoader ?????? ????? GLB -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<div id="crosshair"></div>
<div id="instructions">
    <h1>CLICK TO PLAY</h1>
    <p>WASD = Move | SPACE = Jump | Left Click = Destroy Object (Tree / Rock)</p>
</div>

<script>
    // 1. ?????? ?????????
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xffffff, 1.0);
    sun.position.set(50, 100, 50);
    sun.castShadow = true;
    scene.add(sun);

    // 2. ???? ????? ??? GLB
    const loader = new THREE.GLTFLoader();
    
    let playerModel = null;
    let terrainModel = null;
    const destructibleObjects = []; // ???????? ??????? ??????? ????????

    // ????? ??????? tabletop_terrain.glb
    loader.load('tabletop_terrain.glb', (gltf) => {
        terrainModel = gltf.scene;
        scene.add(terrainModel);

        // ????? ?? ?????? ????? ?????? ???? ??????? ?????? ??????? ???????? ?????
        terrainModel.traverse((child) => {
            if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;

                // ?????? ??? ?????? ????? ?? ????? ????? ??? ????? ?? ???????
                const name = child.name.toLowerCase();
                if (name.includes('tree') || name.includes('rock') || name.includes('stone') || name.includes('wood')) {
                    destructibleObjects.push(child);
                }
            }
        });
        console.log("Terrain Loaded Successfully!");
    }, undefined, (error) => {
        console.error("Error loading terrain:", error);
    });

    // ????? ??????? player.glb
    loader.load('player.glb', (gltf) => {
        playerModel = gltf.scene;
        playerModel.scale.set(1, 1, 1); // ????? ????? ??? ??? ?????
        scene.add(playerModel);
        console.log("Player Loaded Successfully!");
    }, undefined, (error) => {
        console.error("Error loading player:", error);
    });

    // 3. ??????? ?????? ???????
    const player = {
        position: new THREE.Vector3(0, 2, 5),
        speed: 0.15,
        radius: 0.6
    };

    const keys = {};
    document.addEventListener('keydown', (e) => keys[e.code] = true);
    document.addEventListener('keyup', (e) => keys[e.code] = false);

    const instructions = document.getElementById('instructions');
    instructions.addEventListener('click', () => document.body.requestPointerLock());

    document.addEventListener('pointerlockchange', () => {
        instructions.style.display = (document.pointerLockElement === document.body) ? 'none' : 'flex';
    });

    let yaw = 0, pitch = 0;
    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === document.body) {
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
        }
    });

    // 4. ???? ????? ??????? ??????? ?????? (Left Click)
    const raycaster = new THREE.Raycaster();
    document.addEventListener('mousedown', (e) => {
        if (document.pointerLockElement === document.body && e.button === 0) {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            // ??? ??????? ??????? ???????
            const intersects = raycaster.intersectObjects(terrainModel ? terrainModel.children : [], true);

            if (intersects.length > 0 && intersects[0].distance < 10) {
                const hitMesh = intersects[0].object;
                
                // ????? ?????? ?????? ?? ???? ?? ??????
                hitMesh.visible = false;
                
                // ?????? ?? ????? ???????
                const index = destructibleObjects.indexOf(hitMesh);
                if (index !== -1) {
                    destructibleObjects.splice(index, 1);
                }
            }
        }
    });

    // 5. ??????? ?? ???????? ????????
    function handleCollisions(targetPos) {
        // ??? ?????? ??? ????? ??????? ?????????
        if (targetPos.y < 1) targetPos.y = 1;

        // ??????? ?? ???????
        for (let obj of destructibleObjects) {
            if (!obj.visible) continue;

            const objPos = new THREE.Vector3();
            obj.getWorldPosition(objPos);

            let dx = targetPos.x - objPos.x;
            let dz = targetPos.z - objPos.z;
            let dist = Math.sqrt(dx * dx + dz * dz);
            let minDist = player.radius + 1.0;

            if (dist < minDist) {
                let overlap = minDist - dist;
                let angle = Math.atan2(dz, dx);
                targetPos.x += Math.cos(angle) * overlap;
                targetPos.z += Math.sin(angle) * overlap;
            }
        }
    }

    // 6. ???? ??????? ???????? ???????
    function animate() {
        requestAnimationFrame(animate);

        if (document.pointerLockElement === document.body) {
            const front = (keys['KeyS'] ? 1 : 0) - (keys['KeyW'] ? 1 : 0);
            const side = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);

            const moveVector = new THREE.Vector3(side, 0, front).normalize();
            moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            let nextPos = player.position.clone().addScaledVector(moveVector, player.speed);

            handleCollisions(nextPos);
            player.position.copy(nextPos);

            // ?????? ???? ???? ?????? ?????????
            if (playerModel) {
                playerModel.position.copy(player.position);
                playerModel.rotation.y = yaw;
            }

            camera.position.set(player.position.x, player.position.y + 1.6, player.position.z);
            camera.rotation.order = "YXZ";
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
