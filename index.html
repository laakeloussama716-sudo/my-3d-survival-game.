<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>3D Survival Engine - Full Map with Collision</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #instructions {
            position: absolute; top: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; background: rgba(0,0,0,0.7); color: white;
            cursor: pointer; z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="instructions">
    <h1>CLICK TO PLAY</h1>
    <p>WASD = Move | SPACE = Jump | Left Click = Destroy Object | F3 = Camera | I = Inventory</p>
</div>

<script>
    // 1. ?????? ?????????
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 2. ???????
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xffffff, 0.8);
    sun.position.set(100, 150, 50);
    sun.castShadow = true;
    scene.add(sun);

    // 3. ??????? ???????? (?????? ????????? ??????)
    const terrainGeo = new THREE.PlaneGeometry(300, 300, 64, 64);
    terrainGeo.rotateX(-Math.PI / 2);
    
    // ????? ?????? ????? ?????
    const pos = terrainGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let z = pos.getZ(i);
        // ???????? ???? ???? ???? ????? ?????? ????
        let y = Math.sin(x * 0.05) * Math.cos(z * 0.05) * 3;
        pos.setY(i, y);
    }
    terrainGeo.computeVertexNormals();

    const terrainMat = new THREE.MeshLambertMaterial({ color: 0x2e5a1c });
    const terrain = new THREE.Mesh(terrainGeo, terrainMat);
    terrain.receiveShadow = true;
    scene.add(terrain);

    // ????? ????
    const waterGeo = new THREE.PlaneGeometry(300, 300);
    const waterMat = new THREE.MeshBasicMaterial({ color: 0x1d6a96, transparent: true, opacity: 0.7 });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.rotation.x = -Math.PI / 2;
    water.position.y = -1.5;
    scene.add(water);

    // 4. ?????? ????????? ??????? ?????? ??? ??????
    const player = {
        height: 1.8,
        speed: 0.18,
        radius: 0.7,
        position: new THREE.Vector3(0, 5, 20) // ????? ????? ????
    };

    // 5. ????? ??????? ???????? ?? ???????
    const treeColliders = [];

    function spawnTree(x, z) {
        // ???? ?????? ????? ??? ??? ?????? ???? ?????? ?? ?????
        let terrainY = Math.sin(x * 0.05) * Math.cos(z * 0.05) * 3;
        if (terrainY < -0.5) return; // ??? ??? ??????? ???? ?????

        const treeGroup = new THREE.Group();

        // ??? ??????
        const trunkGeo = new THREE.CylinderGeometry(0.5, 0.7, 5, 8);
        const trunkMat = new THREE.MeshLambertMaterial({ color: 0x3d2314 });
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = 2.5;
        trunk.castShadow = true;
        treeGroup.add(trunk);

        // ????? ??????
        const leavesGeo = new THREE.ConeGeometry(2.5, 6, 8);
        const leavesMat = new THREE.MeshLambertMaterial({ color: 0x163e18 });
        const leaves = new THREE.Mesh(leavesGeo, leavesMat);
        leaves.position.y = 6;
        leaves.castShadow = true;
        treeGroup.add(leaves);

        treeGroup.position.set(x, terrainY, z);
        scene.add(treeGroup);

        // ????? ?????? ??????? ???????
        treeColliders.push({
            x: x,
            z: z,
            radius: 0.8
        });
    }

    // ??? ???? ?? ??????? ?? ???????
    for (let i = -100; i < 100; i += 15) {
        for (let j = -100; j < 100; j += 15) {
            if (Math.abs(i) > 10 || Math.abs(j - 20) > 10) { // ??? ????? ??????? ?????
                spawnTree(i + (Math.random() * 6 - 3), j + (Math.random() * 6 - 3));
            }
        }
    }

    // 6. ?????? ??????? ?????????
    const keys = {};
    document.addEventListener('keydown', (e) => keys[e.code] = true);
    document.addEventListener('keyup', (e) => keys[e.code] = false);

    const instructions = document.getElementById('instructions');
    instructions.addEventListener('click', () => document.body.requestPointerLock());

    document.addEventListener('pointerlockchange', () => {
        instructions.style.display = (document.pointerLockElement === document.body) ? 'none' : 'flex';
    });

    let yaw = 0, pitch = 0;
    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === document.body) {
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
        }
    });

    // 7. ???????? ??? ?????? ??????? ??????
    function handleCollisions(targetPos) {
        // ????? ???????
        for (let tree of treeColliders) {
            let dx = targetPos.x - tree.x;
            let dz = targetPos.z - tree.z;
            let dist = Math.sqrt(dx * dx + dz * dz);
            let minDist = player.radius + tree.radius;

            if (dist < minDist) {
                let overlap = minDist - dist;
                let angle = Math.atan2(dz, dx);
                targetPos.x += Math.cos(angle) * overlap;
                targetPos.z += Math.sin(angle) * overlap;
            }
        }

        // ??? ?????? ?????? ???????? ??? ?????? ????? (???? ?????? ??? ?????)
        let currentTerrainY = Math.sin(targetPos.x * 0.05) * Math.cos(targetPos.z * 0.05) * 3;
        targetPos.y = Math.max(currentTerrainY + player.height, -1 + player.height); // ???? ????? ????? ??? ?????
    }

    // 8. ???? ???????
    function animate() {
        requestAnimationFrame(animate);

        if (document.pointerLockElement === document.body) {
            const front = (keys['KeyS'] ? 1 : 0) - (keys['KeyW'] ? 1 : 0);
            const side = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);

            const moveVector = new THREE.Vector3(side, 0, front).normalize();
            moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            let nextPos = player.position.clone().addScaledVector(moveVector, player.speed);

            handleCollisions(nextPos);

            player.position.copy(nextPos);

            camera.position.copy(player.position);
            camera.rotation.order = "YXZ";
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
