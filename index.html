<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Survival Game Engine - High Performance</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            background-color: #000;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 10;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffffff;
            z-index: 10;
            pointer-events: none;
        }
        #ui h2 {
            margin: 0 0 5px 0;
            font-size: 20px;
            color: #00ffcc;
        }
        #ui p {
            margin: 0;
            font-size: 13px;
            opacity: 0.9;
        }

        #fps-counter {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #00ffcc;
            font-family: monospace;
            font-size: 15px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 12px;
            border-radius: 4px;
            display: none;
            z-index: 10;
            border: 1px solid #00ffcc;
        }

        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(10, 10, 10, 0.8);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 10;
        }
        .hotbar-slot {
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #555;
            border-radius: 6px;
        }
        .hotbar-slot.active {
            border-color: #00ffcc;
            background: rgba(0, 255, 204, 0.1);
        }

        #inventory-overlay, #settings-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 30;
        }

        .modal-box {
            background: #12161f;
            border: 2px solid #334455;
            border-radius: 10px;
            color: #ffffff;
        }

        #inventory-box {
            width: 680px;
            height: 420px;
            display: flex;
            padding: 20px;
            gap: 20px;
        }
        #slots-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            flex: 2;
        }
        .inv-slot {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid #334455;
            border-radius: 6px;
            cursor: pointer;
        }
        .inv-slot:hover {
            border-color: #00ffcc;
        }
        #crafting-space {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed #334455;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #8899aa;
            font-size: 14px;
            text-align: center;
            padding: 10px;
        }

        #settings-box {
            width: 400px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        #settings-box h2 {
            margin: 0 0 10px 0;
            text-align: center;
            border-bottom: 1px solid #334455;
            padding-bottom: 10px;
            color: #00ffcc;
        }
        .setting-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .setting-row label {
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            color: #dddddd;
        }
        .setting-row input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .setting-checkbox {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            color: #dddddd;
            font-size: 14px;
        }

        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            color: white;
            background: rgba(10, 10, 10, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }
        #instructions h1 {
            font-size: 38px;
            margin-bottom: 10px;
            color: #00ffcc;
        }
        #instructions p {
            font-size: 15px;
            color: #cccccc;
            max-width: 580px;
            line-height: 1.5;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="fps-counter">FPS: 0</div>

    <div id="ui">
        <h2>3D Survival Engine</h2>
        <p>WASD: Move | SPACE: Jump | Left Click: Mine | F3: Camera View | I: Inventory | P: Settings</p>
    </div>

    <div id="hotbar">
        <div class="hotbar-slot active"></div>
        <div class="hotbar-slot"></div>
        <div class="hotbar-slot"></div>
        <div class="hotbar-slot"></div>
        <div class="hotbar-slot"></div>
    </div>

    <div id="inventory-overlay">
        <div id="inventory-box" class="modal-box">
            <div id="slots-container"></div>
            <div id="crafting-space">
                <p style="margin:0; font-weight:bold;">Crafting Station</p>
                <p style="font-size:12px; margin-top:5px;">Place items here to craft tools and structures.</p>
            </div>
        </div>
    </div>

    <div id="settings-overlay">
        <div id="settings-box" class="modal-box">
            <h2>Game Settings</h2>

            <div class="setting-row">
                <label>Graphics Quality: <span id="gfx-value">100%</span></label>
                <input type="range" id="gfx-slider" min="20" max="100" value="100">
            </div>

            <div class="setting-row">
                <label>Fog View Distance: <span id="fog-value">Medium</span></label>
                <input type="range" id="fog-slider" min="1" max="3" value="2">
            </div>

            <div class="setting-row">
                <label>Audio Volume: <span id="vol-value">80%</span></label>
                <input type="range" id="vol-slider" min="0" max="100" value="80">
            </div>

            <div class="setting-checkbox">
                <span>Show FPS Counter</span>
                <input type="checkbox" id="fps-toggle">
            </div>
        </div>
    </div>

    <div id="instructions">
        <h1 id="loading-title">LOADING WORLD...</h1>
        <p id="loading-sub">Preparing map terrain and placing natural resources...</p>
    </div>

    <script>
        // --- 1. SCENE SETUP & PERFORMANCE CONFIGURATION ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec0ee);
        scene.fog = new THREE.FogExp2(0x7ec0ee, 0.007);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 800);
        
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.BasicShadowMap;
        document.body.appendChild(renderer.domElement);

        // Optimized Simple Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const sun = new THREE.DirectionalLight(0xfff5ea, 0.9);
        sun.position.set(40, 80, 30);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 512;
        sun.shadow.mapSize.height = 512;
        scene.add(sun);

        // --- 2. GLOBAL ASSETS MANAGEMENT ---
        const loader = new THREE.GLTFLoader();
        const terrainMeshes = [];
        const breakableObjects = [];

        let isTerrainLoaded = false;
        let loadedTreeModel = null;
        let loadedRockModel = null;

        const loadingSub = document.getElementById('loading-sub');

        // --- 3. TERRAIN LOADING ---
        loader.load('tabletop_terrain.glb',
            (gltf) => {
                const terrain = gltf.scene;
                terrain.position.set(0, 0, 0);

                terrain.traverse((child) => {
                    if (child.isMesh) {
                        const name = child.name.toLowerCase();
                        if (name.includes('tree') || name.includes('rock') || name.includes('foliage') ||
                            name.includes('stone') || name.includes('wood') || name.includes('plant') || name.includes('bush')) {
                            child.visible = false;
                        } else {
                            child.receiveShadow = true;
                            terrainMeshes.push(child);
                        }
                    }
                });

                scene.add(terrain);
                isTerrainLoaded = true;

                document.getElementById('loading-title').innerText = "CLICK TO PLAY";
                loadingSub.innerText = "WASD = Move | Space = Jump | Left Click = Mine Resources | F3 = Toggle Camera";

                loadBackgroundProps();
            },
            (xhr) => {
                if (xhr.lengthComputable) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    loadingSub.innerText = `Loading Map Terrain: ${percent}%`;
                }
            },
            (error) => {
                console.error("Terrain Load Error:", error);
                loadingSub.innerText = "Error loading tabletop_terrain.glb file!";
            }
        );

        function loadBackgroundProps() {
            loader.load('pine_tree.glb', (gltfTree) => {
                loadedTreeModel = gltfTree.scene;
                spawnTrees();
            }, undefined, (err) => console.warn("pine_tree.glb failed to load", err));

            loader.load('crystal_stone_rock.glb', (gltfRock) => {
                loadedRockModel = gltfRock.scene;
                spawnRocks();
            }, undefined, (err) => console.warn("crystal_stone_rock.glb failed to load", err));
        }

        const terrainRaycaster = new THREE.Raycaster();
        function getGroundHeight(x, z) {
            if (terrainMeshes.length === 0) return null;
            terrainRaycaster.set(new THREE.Vector3(x, 500, z), new THREE.Vector3(0, -1, 0));
            const hits = terrainRaycaster.intersectObjects(terrainMeshes, true);
            if (hits.length > 0) return hits[0].point.y;
            return null;
        }

        function spawnTrees() {
            if (!loadedTreeModel) return;
            let treeCount = 0;
            let attempts = 0;

            while (treeCount < 20 && attempts < 200) {
                attempts++;
                const x = (Math.random() - 0.5) * 120;
                const z = (Math.random() - 0.5) * 120;
                if (Math.abs(x) < 12 && Math.abs(z) < 12) continue;

                const y = getGroundHeight(x, z);
                if (y !== null) {
                    const tree = loadedTreeModel.clone(true);
                    tree.position.set(x, y, z);
                    
                    const scale = 0.6 + Math.random() * 0.3;
                    tree.scale.set(scale, scale, scale);
                    tree.rotation.y = Math.random() * Math.PI * 2;

                    tree.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.userData = { isTree: true, hp: 4, parentGroup: tree };
                            breakableObjects.push(child);
                        }
                    });

                    scene.add(tree);
                    treeCount++;
                }
            }
        }

        function spawnRocks() {
            if (!loadedRockModel) return;
            let rockCount = 0;
            let attempts = 0;

            while (rockCount < 14 && attempts < 200) {
                attempts++;
                const x = (Math.random() - 0.5) * 110;
                const z = (Math.random() - 0.5) * 110;
                if (Math.abs(x) < 12 && Math.abs(z) < 12) continue;

                const y = getGroundHeight(x, z);
                if (y !== null) {
                    const rock = loadedRockModel.clone(true);
                    rock.position.set(x, y + 0.2, z);
                    
                    const scale = 0.4 + Math.random() * 0.3;
                    rock.scale.set(scale, scale, scale);
                    rock.rotation.y = Math.random() * Math.PI * 2;

                    rock.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.userData = { isRock: true, hp: 6, parentGroup: rock };
                            breakableObjects.push(child);
                        }
                    });

                    scene.add(rock);
                    rockCount++;
                }
            }
        }

        // --- 4. PLAYER & CAMERA SYSTEM ---
        const playerGroup = new THREE.Group();
        playerGroup.position.set(0, 15, 0); // Elevated initial spawn height
        scene.add(playerGroup);

        let playerMesh = null;
        let mixer = null;
        let animationsMap = new Map();
        const PLAYER_HEIGHT_OFFSET = 1.6; // Raised offset to keep player above ground

        loader.load('player.glb', (gltf) => {
            playerMesh = gltf.scene;
            playerMesh.position.y = 0;
            
            playerMesh.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                }
            });

            playerGroup.add(playerMesh);

            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(playerMesh);
                gltf.animations.forEach(clip => animationsMap.set(clip.name.toLowerCase(), mixer.clipAction(clip)));
                const firstAnim = animationsMap.values().next().value;
                if (firstAnim) firstAnim.play();
            }
            updatePerspective();
        }, undefined, () => {
            playerMesh = new THREE.Mesh(
                new THREE.CapsuleGeometry(0.5, 1.2, 4, 8),
                new THREE.MeshStandardMaterial({ color: 0x2266cc })
            );
            playerMesh.position.y = PLAYER_HEIGHT_OFFSET / 2;
            playerGroup.add(playerMesh);
            updatePerspective();
        });

        let isThirdPerson = false;
        const cameraRig = new THREE.Group();
        playerGroup.add(cameraRig);
        cameraRig.add(camera);

        function updatePerspective() {
            if (!isThirdPerson) {
                camera.position.set(0, PLAYER_HEIGHT_OFFSET, 0.1);
                camera.rotation.set(0, 0, 0);
                if (playerMesh) playerMesh.visible = false;
            } else {
                camera.position.set(0, PLAYER_HEIGHT_OFFSET + 0.8, 3.5);
                camera.rotation.set(-0.15, 0, 0);
                if (playerMesh) playerMesh.visible = true;
            }
        }
        updatePerspective();

        const downRaycaster = new THREE.Raycaster();
        const mineRaycaster = new THREE.Raycaster();

        document.addEventListener('mousedown', (e) => {
            if (!isLocked || isInventoryOpen || isSettingsOpen || e.button !== 0 || !isTerrainLoaded) return;

            mineRaycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = mineRaycaster.intersectObjects(breakableObjects, true);

            if (intersects.length > 0 && intersects[0].distance <= 9.0) {
                const hitObj = intersects[0].object;

                if (hitObj.userData && (hitObj.userData.isTree || hitObj.userData.isRock)) {
                    hitObj.userData.hp -= 1;

                    if (hitObj.userData.hp <= 0) {
                        const targetGroup = hitObj.userData.parentGroup;
                        targetGroup.traverse((child) => {
                            const index = breakableObjects.indexOf(child);
                            if (index > -1) breakableObjects.splice(index, 1);
                        });
                        scene.remove(targetGroup);
                    }
                }
            }
        });

        // --- 5. UI & INPUT CONTROLS ---
        let isLocked = false;
        let isInventoryOpen = false;
        let isSettingsOpen = false;

        const instructions = document.getElementById('instructions');
        const inventoryOverlay = document.getElementById('inventory-overlay');
        const settingsOverlay = document.getElementById('settings-overlay');

        instructions.addEventListener('click', () => {
            if (!isInventoryOpen && !isSettingsOpen && isTerrainLoaded) {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            isLocked = (document.pointerLockElement === document.body);
            instructions.style.display = (!isLocked && !isInventoryOpen && !isSettingsOpen) ? 'flex' : 'none';
        });

        let yaw = 0, pitch = 0;
        document.addEventListener('mousemove', (e) => {
            if (!isLocked || isInventoryOpen || isSettingsOpen) return;

            yaw -= e.movementX * 0.0022;
            pitch -= e.movementY * 0.0018;
            pitch = Math.max(-1.2, Math.min(1.2, pitch));

            playerGroup.rotation.y = yaw;
            cameraRig.rotation.x = pitch;
        });

        const slotsContainer = document.getElementById('slots-container');
        for (let i = 0; i < 15; i++) {
            const slot = document.createElement('div');
            slot.className = 'inv-slot';
            slotsContainer.appendChild(slot);
        }

        const gfxSlider = document.getElementById('gfx-slider');
        const gfxValue = document.getElementById('gfx-value');
        const fogSlider = document.getElementById('fog-slider');
        const fogValue = document.getElementById('fog-value');
        const volSlider = document.getElementById('vol-slider');
        const volValue = document.getElementById('vol-value');
        const fpsToggle = document.getElementById('fps-toggle');
        const fpsCounter = document.getElementById('fps-counter');

        gfxSlider.addEventListener('input', (e) => {
            gfxValue.innerText = e.target.value + '%';
            renderer.setPixelRatio(window.devicePixelRatio * Math.max(0.2, e.target.value / 100));
        });

        fogSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            if (val === 1) {
                fogValue.innerText = "Low";
                scene.fog.density = 0.004;
            } else if (val === 2) {
                fogValue.innerText = "Medium";
                scene.fog.density = 0.008;
            } else {
                fogValue.innerText = "High (Max FPS)";
                scene.fog.density = 0.015;
            }
        });

        volSlider.addEventListener('input', (e) => volValue.innerText = e.target.value + '%');
        fpsToggle.addEventListener('change', (e) => fpsCounter.style.display = e.target.checked ? 'block' : 'none');

        const keys = {};
        let velocityY = 0;
        let isGrounded = false;

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;

            if (e.code === 'F3') {
                e.preventDefault();
                isThirdPerson = !isThirdPerson;
                updatePerspective();
            }

            if (e.code === 'KeyI') {
                if (isSettingsOpen) closeSettings();
                isInventoryOpen = !isInventoryOpen;
                if (isInventoryOpen) {
                    inventoryOverlay.style.display = 'flex';
                    instructions.style.display = 'none';
                    document.exitPointerLock();
                } else {
                    inventoryOverlay.style.display = 'none';
                    document.body.requestPointerLock();
                }
            }

            if (e.code === 'KeyP') {
                if (isInventoryOpen) {
                    isInventoryOpen = false;
                    inventoryOverlay.style.display = 'none';
                }
                isSettingsOpen = !isSettingsOpen;
                if (isSettingsOpen) {
                    settingsOverlay.style.display = 'flex';
                    instructions.style.display = 'none';
                    document.exitPointerLock();
                } else {
                    closeSettings();
                }
            }

            if (e.code === 'Space' && isGrounded && isLocked) {
                velocityY = 10.0;
                isGrounded = false;
            }
        });

        function closeSettings() {
            isSettingsOpen = false;
            settingsOverlay.style.display = 'none';
            document.body.requestPointerLock();
        }

        document.addEventListener('keyup', (e) => keys[e.code] = false);

        // --- 6. ANIMATION & PHYSICS LOOP ---
        let clock = new THREE.Clock();
        let frameCount = 0;
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            frameCount++;
            if (performance.now() - lastTime >= 1000) {
                fpsCounter.innerText = `FPS: ${frameCount}`;
                frameCount = 0;
                lastTime = performance.now();
            }

            const delta = Math.min(clock.getDelta(), 0.1);
            if (mixer) mixer.update(delta);

            if (isLocked && !isInventoryOpen && !isSettingsOpen && isTerrainLoaded) {
                const moveSpeed = 10.0 * delta;
                const moveVector = new THREE.Vector3();

                if (keys['KeyW']) moveVector.z -= 1;
                if (keys['KeyS']) moveVector.z += 1;
                if (keys['KeyA']) moveVector.x -= 1;
                if (keys['KeyD']) moveVector.x += 1;

                if (moveVector.lengthSq() > 0) {
                    moveVector.normalize();
                    moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                    playerGroup.position.addScaledVector(moveVector, moveSpeed);
                }

                downRaycaster.set(
                    new THREE.Vector3(playerGroup.position.x, playerGroup.position.y + 3.0, playerGroup.position.z),
                    new THREE.Vector3(0, -1, 0)
                );
                
                const groundHits = downRaycaster.intersectObjects(terrainMeshes, true);

                if (groundHits.length > 0) {
                    const groundY = groundHits[0].point.y;
                    velocityY += -28.0 * delta;
                    playerGroup.position.y += velocityY * delta;

                    if (playerGroup.position.y <= groundY + 0.05) {
                        playerGroup.position.y = groundY + 0.05;
                        velocityY = 0;
                        isGrounded = true;
                    }
                } else {
                    velocityY += -28.0 * delta;
                    playerGroup.position.y += velocityY * delta;
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
