<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>3D Survival Game - Fixed Spawn & Collisions</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #instructions {
            position: absolute; top: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; background: rgba(0,0,0,0.7); color: white;
            cursor: pointer; z-index: 10;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="instructions">
    <h1>CLICK TO PLAY</h1>
    <p>WASD = Move | SPACE = Jump | Mouse = Look</p>
</div>

<script>
    // 1. ????? ?????? ??????? ?????????
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // ??? ??????
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 2. ???????
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
    sunLight.position.set(50, 100, 50);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // 3. ??????? (Terrain)
    const floorGeometry = new THREE.PlaneGeometry(200, 200);
    const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x3b5e2b });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // 4. ??????? ?????? ????? ??????? ?????? (Safe Spawn)
    const player = {
        height: 1.8,
        speed: 0.15,
        radius: 0.6, // ??? ??? ????? ??????
        velocity: new THREE.Vector3(),
        position: new THREE.Vector3(0, 1.8, 10) // ???????? ????? ????? ??? ?????
    };
    camera.position.copy(player.position);

    // 5. ?????? ???? ????? ??????? (Trees Colliders)
    const treeColliders = [];

    // ???? ????? ???? ?? ????? ??? ??????? ????? ???
    function createTree(x, z) {
        const treeGroup = new THREE.Group();

        // ??? ??????
        const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 4, 8);
        const trunkMat = new THREE.MeshLambertMaterial({ color: 0x4a2e18 });
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = 2;
        trunk.castShadow = true;
        treeGroup.add(trunk);

        // ????? ??????
        const leavesGeo = new THREE.ConeGeometry(2, 5, 8);
        const leavesMat = new THREE.MeshLambertMaterial({ color: 0x1e4d2b });
        const leaves = new THREE.Mesh(leavesGeo, leavesMat);
        leaves.position.y = 5.5;
        leaves.castShadow = true;
        treeGroup.add(leaves);

        treeGroup.position.set(x, 0, z);
        scene.add(treeGroup);

        // ??? ?????? ????? ?????? (?????? ???? ??? ?????)
        treeColliders.push({
            position: new THREE.Vector2(x, z),
            radius: 0.6 // ??? ??? ??????? ?????
        });
    }

    // ??? ?????? ?? ??????? ?????? ?? ????? ????? ??????
    const treePositions = [
        [5, -5], [-8, -10], [12, 8], [-15, 5], [10, -18], [-5, 15]
    ];
    treePositions.forEach(pos => createTree(pos[0], pos[1]));

    // 6. ?????? ??????? (Controls & Input)
    const keys = {};
    document.addEventListener('keydown', (e) => keys[e.code] = true);
    document.addEventListener('keyup', (e) => keys[e.code] = false);

    const instructions = document.getElementById('instructions');
    instructions.addEventListener('click', () => {
        document.body.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement === document.body) {
            instructions.style.display = 'none';
        } else {
            instructions.style.display = 'flex';
        }
    });

    let yaw = 0, pitch = 0;
    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === document.body) {
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
        }
    });

    // 7. ???? ??? ??????? ??? ?????? ???????? (Collision Detection)
    function checkTreeCollisions(newPos) {
        const playerRadius = player.radius;

        for (let tree of treeColliders) {
            // ???? ??????? ??? ?????? ???? ?????? ??? ??????? XZ
            const dx = newPos.x - tree.position.x;
            const dz = newPos.z - tree.position.y;
            const distance = Math.sqrt(dx * dx + dz * dz);
            const minDistance = playerRadius + tree.radius;

            // ??? ??? ????? (?????)
            if (distance < minDistance) {
                // ????? ?????? ????? ???? ????????
                const overlap = minDistance - distance;
                const angle = Math.atan2(dz, dx);

                newPos.x += Math.cos(angle) * overlap;
                newPos.z += Math.sin(angle) * overlap;
            }
        }
    }

    // 8. ?????? ???????? ????? (Game Loop)
    function animate() {
        requestAnimationFrame(animate);

        if (document.pointerLockElement === document.body) {
            // ????? ?????? ????? ??? ????? ????????
            const frontVector = new THREE.Vector3(0, 0, (keys['KeyS'] ? 1 : 0) - (keys['KeyW'] ? 1 : 0));
            const sideVector = new THREE.Vector3((keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0), 0, 0);
            
            const moveDir = new THREE.Vector3()
                .addVectors(frontVector, sideVector)
                .normalize()
                .applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            // ???? ?????? ???????
            let nextPosition = player.position.clone().addScaledVector(moveDir, player.speed);

            // ????? ??????? ?? ???????
            checkTreeCollisions(nextPosition);

            // ??????? ??????? ????? ?????? ?????????
            player.position.copy(nextPosition);
            
            // ?????? ??? ?????? ????? (??? ?????? ??? ?????)
            player.position.y = player.height;

            // ????? ????? ????????
            camera.position.copy(player.position);
            camera.rotation.order = "YXZ";
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }

        renderer.render(scene, camera);
    }

    animate();

    // ????? ??? ?????? ??? ????? ??? ???????
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
